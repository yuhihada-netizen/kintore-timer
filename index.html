<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111418">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>筋トレタイマー</title>
<style>
:root{--bg:#111418;--card:#1c2128;--line:#2d343d;--text:#eef1f4;--sub:#9aa5b1;--work:#ff8a2b;--rest:#34c27a;--danger:#ef5b5b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Noto Sans JP",sans-serif;padding:0 16px 48px;max-width:560px;margin-inline:auto}
h1{font-size:20px;margin:18px 0 12px}
h2{font-size:15px;color:var(--sub);margin:22px 0 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
button{font:inherit;color:var(--text);background:#2a323c;border:0;border-radius:10px;padding:10px 14px;min-height:44px}
button.primary{background:var(--work);color:#1a1006;font-weight:700}
button.danger{color:var(--danger)}
button.small{padding:6px 10px;min-height:36px}
button:disabled{opacity:.4}
input,select{font:inherit;color:var(--text);background:#0e1115;border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:42px;width:100%}
label{display:block;font-size:12px;color:var(--sub);margin-bottom:2px}
.row{display:flex;gap:8px;align-items:flex-end}
.row>*{flex:1;min-width:0}
.row>.fix{flex:none}
.grid4{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}
.item{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.item:first-child{border-top:0;padding-top:0;margin-top:0}
.itemhead{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
#player{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:8px}
#now{border-radius:14px;padding:16px;text-align:center;background:var(--card);border:2px solid var(--line)}
#now.work{border-color:var(--work)}
#now.rest{border-color:var(--rest)}
#nowLabel{font-size:20px;font-weight:700}
#nowSub{color:var(--sub);font-size:13px;min-height:20px}
#nowTime{font-size:56px;font-weight:800;line-height:1.1;margin:6px 0}
#now.work #nowTime{color:var(--work)}
#now.rest #nowTime{color:var(--rest)}
.ctrl{display:flex;gap:8px;margin-top:10px}
.ctrl button{flex:1}
#bar{height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--work)}
.note{font-size:12px;color:var(--sub)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tabs button{flex:none}
.tabs button.on{background:var(--work);color:#1a1006;font-weight:700}
</style>
</head>
<body>
<h1>筋トレタイマー</h1>

<div id="player">
  <div id="now">
    <div id="nowLabel">メニューを選んで開始</div>
    <div id="nowSub"></div>
    <div id="nowTime">--</div>
    <div id="bar"><i></i></div>
  </div>
  <div class="ctrl">
    <button id="btnPrev" disabled>⏮</button>
    <button id="btnMain" class="primary">開始</button>
    <button id="btnNext" disabled>⏭</button>
    <button id="btnStop" disabled>停止</button>
  </div>
  <p class="note" id="pipNote"></p>
</div>

<h2>メニュー</h2>
<div class="tabs" id="tabs"></div>
<div class="row" style="margin-top:8px">
  <button class="small" id="addMenu">＋ 新規</button>
  <button class="small" id="dupMenu">複製</button>
  <button class="small danger" id="delMenu">削除</button>
</div>

<h2>メニューの設定</h2>
<div class="card">
  <label>メニュー名</label>
  <input id="mName">
  <div class="row" style="margin-top:8px">
    <div><label>最初の準備（秒）</label><input id="mPrep" type="number" inputmode="numeric" min="0"></div>
    <div><label>種目間の休憩（秒）</label><input id="mRest" type="number" inputmode="numeric" min="0"></div>
  </div>
</div>

<h2>種目</h2>
<div class="card" id="items"></div>
<button id="addItem" style="width:100%">＋ 種目を追加</button>

<p class="note" style="margin-top:20px">合計時間：<span id="total"></span></p>
<p class="note">使い方：「開始」を押すと小さなウィンドウ（PiP）が出ます。そのあとYouTubeを開いてください。ウィンドウは指でドラッグして画面の上の方に動かせます。ウィンドウの ▶/⏸ で一時停止・再開、⏮⏭ で前後の項目へ移動できます。</p>

<video id="pv" muted playsinline style="position:fixed;left:-9999px;width:2px;height:2px"></video>
<canvas id="cv" width="720" height="300" style="display:none"></canvas>
<script src="app.js"></script>
</body>
</html>
